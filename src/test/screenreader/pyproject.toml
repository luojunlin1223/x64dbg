[project]
name = "vm64-screenreader-checks"
version = "0.1.0"
description = "UIA-based accessibility checks for vm64 table views."
requires-python = ">=3.11"
dependencies = [
    "pywinauto>=0.6.9",
]

[tool.setuptools]
py-modules = ["screenreader_check", "ui_dump", "ui_common"]

[project.scripts]
vm64-screenreader-checks = "screenreader_check:main"
vm64-ui-dump = "ui_dump:main"

[tool.uv]
package = true
